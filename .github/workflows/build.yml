name: Build AdminMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AdminMenu.csproj

      - name: Build
        run: dotnet build AdminMenu.csproj -c Release --no-restore

      - name: Find AdminMenu DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Recurse -Filter AdminMenu.dll |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]Release[\\/]' } |
            Select-Object -First 1

          if (-not $dll) {
            throw "AdminMenu.dll was not found."
          }

          Write-Host "Found DLL at: $($dll.FullName)"

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact/AdminMenu.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AdminMenu-DLL
          path: artifact/AdminMenu.dll
          if-no-files-found: error
